<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="flockdeck">
  <!-- Idle: nothing is running. Present, asking for nothing.
       Two agents at rest on the flockdeck and one raised: the glyphs the pane
       header already uses, ● working and ▲ waiting. Colours are the tokens
       from design/color.css. Keep the geometry identical across the variants —
       only the raised bird changes colour, so the swap reads as a state
       change and not as a different application. Here the whole mark dims. -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#151B20"/>
  <rect x="1.5" y="1.5" width="29" height="29" rx="6.5" fill="none" stroke="#FFFFFF" stroke-opacity=".1"/>
  <g transform="translate(2.46 4.15) scale(.846)">
    <rect fill="#738087" x="3" y="22" width="26" height="2.6" rx="1.3"/>
    <circle fill="#738087" cx="8.4" cy="18" r="3.4"/>
    <circle fill="#738087" cx="23.6" cy="18" r="3.4"/>
    <path fill="#738087" d="M16 3.4L21 12.2H11Z"/>
  </g>
</svg>
