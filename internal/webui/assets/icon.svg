<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="flockdeck">
  <!-- The mark on its tile, and the working state: an agent is running.
       Two agents at rest on the flockdeck and one raised: the glyphs the pane
       header already uses, ● working and ▲ waiting. The tile is what makes
       this read as an application in the taskbar, on a dark one and a light
       one alike; the bare mark there was a few grey dots. Colours are the
       tokens from design/color.css. Keep the geometry identical across the
       variants — only the raised bird changes colour, so the swap reads as a
       state change and not as a different application. -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#151B20"/>
  <rect x="1.5" y="1.5" width="29" height="29" rx="6.5" fill="none" stroke="#FFFFFF" stroke-opacity=".1"/>
  <g transform="translate(2.46 4.15) scale(.846)">
    <rect fill="#C9D3D9" x="3" y="22" width="26" height="2.6" rx="1.3"/>
    <circle fill="#C9D3D9" cx="8.4" cy="18" r="3.4"/>
    <circle fill="#C9D3D9" cx="23.6" cy="18" r="3.4"/>
    <path fill="#4FD1DB" d="M16 3.4L21 12.2H11Z"/>
  </g>
</svg>
