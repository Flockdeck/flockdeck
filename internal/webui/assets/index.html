<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flockdeck</title>
<!-- The window is a Chromium app-mode window, so this is the application icon
     as much as the tab icon: it is what the taskbar and alt-tab show. There is
     no --app-icon, so the OS asks these links for a bitmap at whatever size it
     needs; one size only forced it to stretch that bitmap for every other
     size, which read as a blurry taskbar icon at anything but exactly 32px.
     app.js's ICON_SIZES list must match the sizes named here. It retargets
     every link below as the agents change state. -->
<link id="favicon" rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link id="favicon-16" rel="icon" href="assets/icon-16.png" sizes="16x16" type="image/png">
<link id="favicon-32" rel="icon" href="assets/icon-32.png" sizes="32x32" type="image/png">
<link id="favicon-48" rel="icon" href="assets/icon-48.png" sizes="48x48" type="image/png">
<link id="favicon-128" rel="icon" href="assets/icon-128.png" sizes="128x128" type="image/png">
<link id="favicon-192" rel="icon" href="assets/icon-192.png" sizes="192x192" type="image/png">
<link id="favicon-256" rel="icon" href="assets/icon-256.png" sizes="256x256" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="assets/vendor/xterm.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <!-- Shown from the instant the page has anything to paint, over the rest of
       the page while it is still empty chrome: the rail drawn with nothing in
       it, a project name still saying "project", no tabs. Covering that
       rather than letting it be seen is the whole of what this is for, so it
       is markup and CSS alone, needing no script to appear. app.js takes it
       away once the first state has actually been drawn -- see dismissSplash
       -- fading rather than vanishing, since the change from one to the
       other is exactly the flash this exists to avoid. -->
  <div id="splash" aria-hidden="true">
    <img class="splash-mark" src="assets/icon.svg" alt="" width="56" height="56">
  </div>

  <!-- The rail: the open projects, and everything that opens a dialog. Each
       button's label is real text, kept out of sight beside the icon while the
       rail is a column of icons and shown when a narrow screen folds the rail
       into a menu; either way it is the button's name. The icons are drawn
       from app.js, from one set of path data. -->
  <nav id="rail" aria-label="Projects and tools">
    <img class="rail-mark" src="assets/icon.svg" alt="" width="24" height="24">
    <div class="rail-rule"></div>
    <div id="rail-projects" role="group" aria-label="Open projects"></div>
    <button id="rail-open" class="rail-btn"><span class="ico" data-icon="folderplus" aria-hidden="true"></span><span class="rail-label">Open a project</span></button>
    <div class="rail-fill"></div>
    <button id="btn-broadcast" class="rail-btn"><span class="ico" data-icon="broadcast" aria-hidden="true"></span><span class="rail-label">Broadcast</span></button>
    <button id="btn-changes" class="rail-btn"><span class="ico" data-icon="changes" aria-hidden="true"></span><span class="rail-label">Changes</span></button>
    <button id="btn-history" class="rail-btn"><span class="ico" data-icon="history" aria-hidden="true"></span><span class="rail-label">History</span></button>
    <button id="btn-worktrees" class="rail-btn"><span class="ico" data-icon="worktrees" aria-hidden="true"></span><span class="rail-label">Worktrees</span></button>
    <div class="rail-rule"></div>
    <!-- Always here, so remote access can be found before it is turned on.
         The badge is the tunnel: on, connecting, or wanting attention. -->
    <button id="btn-remote" class="rail-btn remote"><span class="ico" data-icon="remote" aria-hidden="true"></span><span class="rail-badge" aria-hidden="true"></span><span class="rail-label">Remote</span></button>
    <button id="btn-help" class="rail-btn"><span class="ico" data-icon="help" aria-hidden="true"></span><span class="rail-label">Help</span></button>
    <button id="btn-settings" class="rail-btn"><span class="ico" data-icon="settings" aria-hidden="true"></span><span class="rail-label">Settings</span></button>
  </nav>
  <!-- Behind the rail while a narrow screen shows it as a menu; a tap here
       puts it away. The style sheet shows it, from the class on the body. -->
  <div id="rail-scrim"></div>

  <div id="main">
    <header id="topbar">
      <!-- Only on a narrow screen, where the rail is folded away. -->
      <button id="rail-toggle" class="bar-btn" aria-controls="rail" aria-expanded="false"><span class="ico" data-icon="menu" aria-hidden="true"></span></button>
      <button id="project-btn" class="project">
        <span id="project-name">project</span><span id="project-branch" hidden></span><span class="ico caret" data-icon="chev" data-size="14" aria-hidden="true"></span>
      </button>
      <div class="divider-v"></div>
      <div id="tabbar">
        <div id="tabs" role="tablist" aria-label="Tabs"></div>
        <span class="new-tab-group">
          <button id="new-tab" class="bar-btn" aria-label="New agent tab"><span class="ico" data-icon="plus" data-size="14" aria-hidden="true"></span></button>
          <!-- The caret is the slow way round: the plus starts the agent this
               project runs by default, and this asks which agent and which
               model first. -->
          <button id="new-tab-pick" class="bar-btn caret-btn" aria-label="New agent tab, choosing the agent"><span class="ico" data-icon="chev" data-size="12" aria-hidden="true"></span></button>
        </span>
      </div>
      <div class="spacer"></div>
      <!-- The tally is not a live region: every agent starting or stopping
           work changed it, so the counts were read out all the time and
           never said which agent. What is spoken is the region after it,
           fed only when an agent starts waiting on you or exits. -->
      <button id="summary" class="summary"></button>
      <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="false"></div>
      <div class="divider-v summary-rule"></div>
      <!-- The palette, made visible: the keys are filled in from the action
           table, like every other binding on screen. -->
      <button id="btn-palette" class="commands"><span class="ico" data-icon="search" data-size="13" aria-hidden="true"></span><span class="commands-label">Commands</span><span id="palette-keys" class="commands-keys" aria-hidden="true"></span></button>
      <button id="btn-update" class="update" hidden></button>
    </header>

    <div id="hints" hidden></div>

    <main id="workspace"></main>

    <div id="promptbar" hidden>
    <label for="prompt-input" id="prompt-label">Prompt</label>
    <textarea id="prompt-input" rows="1" autocomplete="off" spellcheck="false"
              placeholder="Type an instruction: Enter sends it, Shift+Enter starts a new line"></textarea>
    <button id="prompt-send" class="chip primary">Send</button>
    <button id="prompt-cancel" class="chip">Cancel</button>
  </div>

  <div id="searchbar" hidden>
    <label for="search-input" id="search-label">Find</label>
    <input id="search-input" type="text" autocomplete="off" spellcheck="false" placeholder="Search this terminal">
    <!-- Which match is showing, of how many: without it, stepping through
         them gave no idea how far there was to go. -->
    <span id="search-count" aria-live="polite"></span>
    <button id="search-prev" class="chip" title="Previous (Shift+Enter)" aria-label="Previous match (Shift+Enter)">↑</button>
    <button id="search-next" class="chip" title="Next (Enter)" aria-label="Next match (Enter)">↓</button>
    <button id="search-close" class="chip">Close</button>
  </div>
  </div>

  <div id="palette" hidden>
    <div id="palette-box" role="dialog" aria-modal="true" aria-label="Command palette" tabindex="-1">
      <!-- The field keeps the keyboard while the list below is walked with the
           arrow keys, so it is the field that has to say which command is
           currently picked out: aria-activedescendant, written by app.js. -->
      <input id="palette-input" type="text" autocomplete="off" spellcheck="false"
             aria-label="Command" placeholder="Type a command…"
             role="combobox" aria-expanded="true" aria-autocomplete="list"
             aria-controls="palette-list">
      <div id="palette-list" role="listbox" aria-label="Commands"></div>
    </div>
  </div>

  <!-- Transient toast. It is the only feedback for a command that succeeds or
       fails without changing the screen, so it has to be spoken as well. -->
  <div id="notice" role="status" aria-live="polite" aria-atomic="true" hidden></div>

  <div id="overlay" hidden>
    <div id="overlay-panel" role="dialog" aria-modal="true" aria-labelledby="overlay-title" tabindex="-1">
      <div id="overlay-head">
        <h2 id="overlay-title">Worktrees</h2>
        <button id="overlay-close" class="icon-btn" aria-label="Close this dialog (Esc)" data-tip="Close this dialog (Esc)">×</button>
      </div>
      <div id="overlay-body"></div>
    </div>
  </div>

  <!-- This covers the whole viewport and nothing behind it can be used, so it
       is a modal like the other two, and an alert one: it appears on its own
       rather than because the user asked for it. -->
  <div id="disconnected" hidden>
    <div class="panel" role="alertdialog" aria-modal="true"
         aria-labelledby="disconnected-title" aria-describedby="disconnected-desc">
      <h2 id="disconnected-title">Disconnected</h2>
      <!-- It says that it is already trying again, and what to do if that
           will never work: without it, nothing told anybody whether to wait,
           press the button, or go and start something. -->
      <p id="disconnected-desc">The flockdeck process is no longer running, or the connection was lost.
        This window tries again on its own every couple of seconds, and comes back as it was once flockdeck answers.
        If flockdeck has stopped, start it again and this window reconnects.</p>
      <button id="retry" class="chip primary">Reconnect</button>
    </div>
  </div>

  <script src="assets/vendor/xterm.js"></script>
  <script src="assets/vendor/addon-fit.js"></script>
  <script src="assets/vendor/addon-webgl.js"></script>
  <script src="assets/vendor/addon-search.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
