<!doctype html>
<!-- The social preview card, 1200x630. This is its source: it is rendered to
     shots/og.png once, with a headless browser, rather than on every build,
     because sitegen writes files and has no browser to draw with.

       chrome --headless=new --window-size=1200,630 --hide-scrollbars \
         --screenshot=shots/og.png og.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* The card is drawn in the fonts the site ships, from the files beside
     this one, so rendering it asks nobody else for anything. The colours are
     site.css's, written out: this file is not published and has no sheet. */
  @font-face { font-family: "IBM Plex Sans"; src: url("fonts/ibm-plex-sans.woff2") format("woff2"); font-weight: 100 700; }
  @font-face { font-family: "JetBrains Mono"; src: url("fonts/jetbrains-mono.woff2") format("woff2"); font-weight: 100 800; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0F1418; color: #E6EDF1;
    font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    position: relative;
  }
  .text { position: absolute; left: 72px; top: 76px; width: 560px; z-index: 1; }
  .mark { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 26px; letter-spacing: -.01em; }
  .kicker {
    display: flex; gap: 10px; align-items: center; margin-top: 48px;
    font: 500 16px/1 "JetBrains Mono", monospace; color: #93A1A9;
  }
  /* The waiting mark, drawn as the application draws it. */
  .kicker b { width: 12px; height: 12px; font-size: 0; background: #E2B341; clip-path: polygon(50% 6%, 100% 94%, 0 94%); }
  .kicker span { color: #E2B341; }
  h1 { margin-top: 24px; font-weight: 600; font-size: 64px; line-height: 1.06; letter-spacing: -.028em; }
  h1 em { font-style: normal; color: #4FD1DB; }
  .agents { margin-top: 24px; font: 400 18px/1.55 "JetBrains Mono", monospace; color: #93A1A9; }
  .url { position: absolute; left: 72px; bottom: 56px; font: 500 20px "JetBrains Mono", monospace; color: #4FD1DB; z-index: 1; }
  .shot {
    position: absolute; left: 670px; top: 92px; width: 900px;
    border: 1px solid #2C363D; border-radius: 10px; overflow: hidden;
    box-shadow: 0 20px 56px -16px rgb(0 0 0 / .75);
  }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="text">
    <div class="mark">
      <svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true">
        <rect fill="#93A1A9" x="3" y="22" width="26" height="2.6" rx="1.3"/>
        <circle fill="#93A1A9" cx="8.4" cy="18" r="3.4"/>
        <circle fill="#93A1A9" cx="23.6" cy="18" r="3.4"/>
        <path fill="#4FD1DB" d="M16 3.4L21 12.2H11Z"/>
      </svg>
      Flockdeck
    </div>
    <div class="kicker"><b>▲</b> <span>2 waiting</span> · 2 working</div>
    <h1>Start it on a box that <em>never sleeps</em>.</h1>
    <p class="agents">Claude Code · Codex · Gemini CLI<br>Aider · opencode · any model API</p>
  </div>
  <div class="url">flockdeck.ai</div>
  <div class="shot"><img src="shots/deck.png" alt=""></div>
</body>
</html>
