{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flockdeck.serviceAccountName" . }}
  labels:
    {{- include "flockdeck.labels" . | nindent 4 }}
# flockdeck never asks the Kubernetes API for anything, so it is given no
# token to ask with (the Deployment also sets automountServiceAccountToken
# false on the pod itself).
automountServiceAccountToken: false
{{- end }}
