{{- if include "flockdeck.ownSecret" . }}
# The secret-ish values given to the chart directly: a relay join/invite
# code, and an API key. Each can come from a Secret of your own instead
# (remote.existingSecret, apiKey.existingSecret), which keeps the value out
# of Helm's release record.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flockdeck.secretName" . }}
  labels:
    {{- include "flockdeck.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and .Values.remote.join (not .Values.remote.existingSecret) }}
  remoteJoin: {{ .Values.remote.join | b64enc | quote }}
  {{- end }}
  {{- if and .Values.remote.invite (not .Values.remote.existingSecret) }}
  remoteInvite: {{ .Values.remote.invite | b64enc | quote }}
  {{- end }}
  {{- if and .Values.apiKey.value (not .Values.apiKey.existingSecret) }}
  apiKey: {{ .Values.apiKey.value | b64enc | quote }}
  {{- end }}
{{- end }}
