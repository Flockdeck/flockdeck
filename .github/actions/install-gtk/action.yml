name: Install GTK4/WebKitGTK dev packages
description: >-
  The packages Wails' Linux backend (internal/appwindow, cgo) is compiled
  against, installed from a cache of the downloaded files when there is one.

# Wails' Linux backend is cgo, against GTK4 and the GTK4-based WebKitGTK: go
# vet, build and test all compile it on Linux, whether or not the run ever opens
# a window. Without these packages every step fails at the pkg-config stage, not
# at anything this repo's own code did.
#
# The download is the slow and the unreliable part: 62 to 72 MB from the
# runner's mirror, which has taken from 3 seconds to 5 minutes (251 kB/s), hung
# once for 36 minutes, and on two runs of 22 October failed all three attempts.
# Three things are done about it:
#
#   - Only what the packages depend on is installed, not what they recommend.
#     The recommends were most of the 170 packages, gstreamer plugins among them,
#     which nothing here compiles against or runs.
#   - The downloaded files are cached for the week, so a job on a warm cache
#     fetches only the package lists and what the mirror has changed. The cache
#     is keyed by the week and falls back to the newest earlier one, and a hit
#     on an older one is saved again under the week's key, after the files for
#     versions the mirror has dropped are removed.
#   - A mirror that is slow fails over quickly: apt gives up on a connection
#     that sends nothing for 20 seconds, retries each file, and each attempt is
#     cut off after 7 minutes at the most. From the second attempt the packages
#     come from archive.ubuntu.com rather than the runner's mirror.

runs:
  using: composite
  steps:
    - id: week
      shell: bash
      run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

    # Restored by every run, saved only by a push to main (the last step). A
    # cache a pull request wrote is visible to that pull request alone, but a
    # run that writes nothing cannot poison one at all, and the files are
    # checked again anyway: apt compares every file in the archive folder with
    # the hash in the package lists, which are signed, and fetches it again if
    # they differ.
    - id: cache
      uses: actions/cache/restore@v4
      with:
        path: /var/tmp/gtk-apt-archives
        key: gtk-apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.week.outputs.week }}
        restore-keys: gtk-apt-${{ runner.os }}-${{ runner.arch }}-

    # TEMPORARY, removed before the merge: how much the recommends add.
    - shell: bash
      run: |
        sudo apt-get -qq update || true
        for r in "" "--no-install-recommends"; do
          out=$(sudo apt-get -s install -y $r libgtk-4-dev libwebkitgtk-6.0-dev 2>&1 || true)
          echo "::notice title=simulated install ${r:-with recommends}::$(echo "$out" | grep -c '^Inst') packages; $(echo "$out" | grep 'Need to get' | tr -d '\n')"
        done

    # A killed apt can leave dpkg half done, so it is finished before the next
    # attempt. A step of a composite action has no time limit of its own; the
    # caller sets one on the step that uses this action, and the job has one.
    - shell: bash
      env:
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        start=$SECONDS
        # Outside the home folder, which the user apt downloads as cannot enter.
        dir=/var/tmp/gtk-apt-archives
        sudo mkdir -p "$dir/partial"
        sudo chmod -R a+rwX "$dir"
        echo "cache hit: ${CACHE_HIT:-false}; cached package files: $(find "$dir" -maxdepth 1 -name '*.deb' | wc -l)"
        opts=(-o Dir::Cache::archives="$dir" -o APT::Keep-Downloaded-Packages=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
        for attempt in 1 2 3; do
          if [ "$attempt" -gt 1 ]; then
            sudo dpkg --configure -a || true
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|' /etc/apt/sources.list.d/ubuntu.sources || true
            fi
          fi
          # The first attempt is cut off early: on a good day the 60 MB take
          # 5 to 30 seconds, and on a bad one 5 minutes or more, so waiting
          # longer for the runner's mirror is the slow way to fail over. What
          # it fetched is kept in the folder and not fetched again.
          install_limit=$((attempt == 1 ? 150 : 300))
          if sudo timeout 120 apt-get "${opts[@]}" update && sudo timeout "$install_limit" apt-get "${opts[@]}" install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev; then
            # Files for versions the mirror no longer offers are dropped, so the
            # cache does not grow from week to week. The lock and the folder
            # apt downloads into are not for the cache, and cannot be read by
            # the user that saves it.
            sudo apt-get "${opts[@]}" autoclean || true
            sudo rm -rf "$dir/partial" "$dir/lock"
            sudo chmod -R a+rX "$dir"
            echo "::notice title=GTK install::took $((SECONDS - start)) s on attempt $attempt, cache hit: ${CACHE_HIT:-false}"
            exit 0
          fi
          echo "::warning::apt attempt $attempt failed or timed out"
          sleep 10
        done
        exit 1

    # TEMPORARY, removed before the merge: lets this pull request's runs write
    # the cache, to measure a warm install. The line after the comment is the
    # one that stays.
    - uses: actions/cache/save@v4
      if: steps.cache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/pull/'))
      with:
        path: /var/tmp/gtk-apt-archives
        key: gtk-apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.week.outputs.week }}
