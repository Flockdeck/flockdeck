name: test

# The tests every change is held to, and the whole matrix a release is held to.
# They run on each pull request and on each push to main, so a failure is found
# where it was made rather than when a release is cut: five tags in a row once
# stopped on a macOS or Windows test that no earlier run had reached. The
# release workflow calls this same file before it builds anything, so what a
# change is held to and what a release is held to cannot drift apart.
#
# Minutes are paid for, and a minute on macOS costs ten and one on Windows two,
# so not every run covers every platform:
#
#   pull request, no label   Linux only
#   pull request, labeled    Linux, Windows and macOS, on that push and each
#     ready-to-merge         later one while the label stays on
#   push to main             Linux only
#   release, weekly run      Linux, Windows and macOS (weekly-full.yml calls
#     (Sunday), by hand      this file on Sunday and opens an issue if it fails)
#
# Until the label is on, the "test (windows-latest)" and "test (macos-latest)"
# checks of a pull request fail with a line saying so, which keeps the branch
# protection from letting a change through that was not tried there. On a
# push to main the same two checks pass with a notice: they did not test it.
#
# A push to a branch is not tested on its own: the pull request for it is, and
# running both put every change through the platforms twice. A branch with no
# pull request is therefore not tested until it has one.
#
# Tags are left to the release workflow, which runs these tests itself.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "what to check out; empty is the commit the run is for"
        type: string
        default: ""
      release:
        description: "also hold the code to what only a release needs, such as carrying the release key"
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to a pull request makes the run for the one before it pointless,
# so that run is cancelled and its runners go to the new one. Nothing else is
# ever cancelled: a run for main, a release or an image build gets a group of
# its own, named by its run, so that no later push can cancel it or take its
# place in the queue (a group holds one pending run, and a newer one replaces
# it). The group name starts with "test-" so it cannot be the name of a group
# the calling workflow, release.yml or docker-image.yml, uses itself. Those
# callers are started by a tag or by hand, never by a pull request.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('test-pr-{0}', github.ref) || format('test-run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the pull request changes nothing but documentation. A change to
  # the docs (the .md and .json files under docs/, and the markdown files at the
  # root) cannot break the build, so the full suite is not run for it: the
  # static, shard and race jobs are skipped, and the Ubuntu leg of the test job
  # runs the tests that read those files. The test job itself still runs and
  # reports, because the branch protection names its three checks, "test
  # (ubuntu-latest)" and the others, and a job that is skipped as a whole is
  # never reported under those names. Every push to main and every release runs
  # everything.
  #
  # The files are read from the merge commit of the pull request, not from the
  # API: the API's list can lag behind a push, and reading it takes a
  # permission a caller of this workflow (release.yml, docker-image.yml) may not
  # grant. A rename is counted as a delete and an add, so both paths are
  # checked. If the list cannot be read, everything runs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      oses: ${{ steps.diff.outputs.oses }}
      counts: ${{ steps.diff.outputs.counts }}
      shard: ${{ steps.diff.outputs.shard }}
      race: ${{ steps.diff.outputs.race }}
      race_os: ${{ steps.diff.outputs.race_os }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          REF: ${{ github.ref }}
          RELEASE: ${{ inputs.release }}
        run: |
          docs_only=false
          if [ "$EVENT" = pull_request ] && files=$(git diff --name-only --no-renames HEAD^1 HEAD) && [ -n "$files" ]; then
            if ! echo "$files" | grep -Evq '^(docs/.*[.](md|json)|[^/]+[.]md)$'; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"
          # How many shares each platform is split into: four on Linux and
          # Windows, two on macOS, where a minute costs ten times as much and
          # a share ran in about three minutes, most of it setting up. This
          # is the one place the numbers are written. The matrices of the
          # shard and race jobs and the count the test job checks the shares
          # against all come from it.
          counts='{"ubuntu-latest":4,"windows-latest":4,"macos-latest":2}'
          # Which platforms are run. A pull request is run on Linux until it
          # carries the label ready-to-merge; a push to main is run on Linux
          # only. Everything else (a release, which calls this file with the
          # event of its tag, the weekly run, a run by hand) is run on all three.
          all='["ubuntu-latest","windows-latest","macos-latest"]'
          if [ "$RELEASE" = true ]; then
            oses=$all
          elif [ "$EVENT" = pull_request ]; then
            if jq -e 'index("ready-to-merge")' <<< "$LABELS" > /dev/null; then oses=$all; else oses='["ubuntu-latest"]'; fi
          elif [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            oses='["ubuntu-latest"]'
          else
            oses=$all
          fi
          echo "oses=$(jq -c . <<< "$oses")" >> "$GITHUB_OUTPUT"
          echo "oses=$oses"
          # Where the race detector runs: macOS only where it is run and outside
          # pull requests.
          if [ "$EVENT" != pull_request ] && jq -e 'index("macos-latest")' <<< "$oses" > /dev/null; then
            race_os='["ubuntu-latest","macos-latest"]'
          else
            race_os='["ubuntu-latest"]'
          fi
          matrix='{include: [$oses[] | . as $os | range(1; $c[$os] + 1) | {os: $os, shard: ., of: $c[$os]}]}'
          {
            echo "counts=$counts"
            echo "shard=$(jq -c --argjson c "$counts" --argjson oses "$oses" "$matrix" <<< null)"
            echo "race=$(jq -c --argjson c "$counts" --argjson oses "$race_os" "$matrix" <<< null)"
            echo "race_os=$(jq -r 'join(" ")' <<< "$race_os")"
          } >> "$GITHUB_OUTPUT"

  # The checks that are not tests, on each platform: formatting, vet
  # and the tests of the scripts the workflow relies on.
  static:
    name: static (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.oses) }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # The token that fetched the code is not left in .git/config, where
      # every test, and whatever a test runs, could read it. Nothing here
      # needs it: the tests make their own repositories and fetch nothing.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/fast-drive

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The check the action makes of the restored package files is itself
      # tested, with package files made here.
      - name: Test the package cache check (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: bash .github/actions/install-gtk/verify-cache-test.sh

      # The packages Wails' Linux backend (internal/appwindow, cgo) is compiled
      # against, which go vet, build and test all need on Linux. The action
      # caches the downloaded files, installs no recommended packages and fails
      # over from a slow mirror. Three attempts of at most 7 minutes fit in the
      # step's 25.
      - name: Install GTK4/WebKitGTK dev packages (Linux, for Wails)
        if: runner.os == 'Linux'
        timeout-minutes: 25
        uses: ./.github/actions/install-gtk

      # The code is kept gofmt-clean by hand. Checked on Linux only: a Windows
      # checkout turns line endings into CRLF, which gofmt would report in
      # every file.
      - name: Format
        timeout-minutes: 5
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        timeout-minutes: 15
        run: go vet ./...

      # The retry script, run against small packages that fail in the ways
      # that matter to it (docs/testing.md, "When a test fails once").
      - name: Test the retry script
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: bash .github/scripts/go-test-once-more-test.sh

      - name: Test the result check
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: bash .github/scripts/test-gate-test.sh

      # The split of the tests across jobs is the same on every run and for
      # every job, which the jobs rely on to agree without talking.
      - name: Test the split of the tests
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash .github/scripts/shardtests-test.sh

      - if: always()
        uses: ./.github/actions/record-result
        with:
          kind: static
          os: ${{ matrix.os }}
          index: "0"
          status: ${{ job.status }}

  # The tests, in four shares per platform that run at the same time. Each job
  # works out the same split (.github/scripts/shardtests.go) and runs its own
  # share; the job named test (the check the branch protection names) collects
  # them. The split is by package, and by test for the slowest packages, so a
  # test belongs to a share by its name and a new one needs no list.
  #
  # -count=1 runs every test again rather than trusting a result the shared
  # build cache kept from another run, which could have been on other files a
  # test reads, or another machine's timing. -timeout names the limit rather
  # than leaning on go test's ten minutes. A release's run also fails while the
  # release key is still the placeholder (TestReleaseKeyIsInPlace), so a
  # release can never ship unable to check what it downloads. Other runs have
  # no key to hold.
  #
  # A package or a test that fails is run once more on its own before the job
  # fails. One that fails twice still fails it; one that passes the second time
  # is named in a warning, to be fixed rather than forgotten. Six release
  # candidates of v0.3.4 in a row were stopped by a different test each, every
  # one of them the runner's timing.
  shard:
    name: shard (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.of }})
    strategy:
      fail-fast: false
      # The shares per platform are decided in the changes job.
      matrix: ${{ fromJSON(needs.changes.outputs.shard) }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/fast-drive

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GTK4/WebKitGTK dev packages (Linux, for Wails)
        if: runner.os == 'Linux'
        timeout-minutes: 25
        uses: ./.github/actions/install-gtk

      - name: Test
        if: runner.os != 'Windows'
        timeout-minutes: 40
        shell: bash
        env:
          FLOCKDECK_RELEASE_BUILD: ${{ inputs.release && '1' || '' }}
          SHARD: ${{ matrix.shard }}
          OF: ${{ matrix.of }}
          PROFILE: ${{ runner.os == 'macOS' && 'macos' || 'linux' }}
          RETRY_ALL: ${{ github.event_name != 'pull_request' && '-retry-all' || '' }}
        run: |
          go run .github/scripts/shardtests.go -shard "$SHARD/$OF" -profile "$PROFILE" -retry $RETRY_ALL \
            -log "$RUNNER_TEMP/go-test.log" -digest "$RUNNER_TEMP/plan.txt" \
            -gotestflags "-count=1 -timeout 20m"

      # Windows runs the tests from the runner's own shell, PowerShell 7, as it
      # always has: moving them to Git's bash changed what they ran in, and one
      # failed there that had never failed before. Two packages at a time per
      # share: the runner has four cores, and gitx took 600 s with every
      # package running together against 180 to 310 s alone.
      - name: Test
        if: runner.os == 'Windows'
        timeout-minutes: 40
        env:
          FLOCKDECK_RELEASE_BUILD: ${{ inputs.release && '1' || '' }}
          SHARD: ${{ matrix.shard }}
          OF: ${{ matrix.of }}
          RETRY_ALL: ${{ github.event_name != 'pull_request' && '-retry-all' || '' }}
        run: |
          # An empty argument would end the tool's flags, so the optional one
          # is added to a list only when there is one.
          $goargs = @('-shard', "$env:SHARD/$env:OF", '-profile', 'windows', '-retry')
          if ($env:RETRY_ALL) { $goargs += $env:RETRY_ALL }
          $goargs += @('-log', "$env:RUNNER_TEMP\go-test.log", '-digest', "$env:RUNNER_TEMP\plan.txt", '-gotestflags', '-count=1 -timeout 20m -p 2')
          go run .github/scripts/shardtests.go @goargs
          exit $LASTEXITCODE

      # A job's log can only be read signed in to GitHub, and its annotations
      # can be read by anyone, from the web or the API. So a failure is also
      # given as one: every failing test, panic and data race, with what it
      # printed. A test that panics on purpose logs "flockdeck: panic ..." and
      # passes, so only go test's own lines are taken.
      - name: Name the failures
        if: failure()
        timeout-minutes: 5
        shell: bash
        run: |
          : > "$RUNNER_TEMP/failures.txt"
          grep -E -A20 -- '--- FAIL|^panic:|^WARNING: DATA RACE' "$RUNNER_TEMP/go-test.log" | tr -d '\r' >> "$RUNNER_TEMP/failures.txt" || true
          head -c 30000 "$RUNNER_TEMP/failures.txt" > "$RUNNER_TEMP/failures.cut" && mv "$RUNNER_TEMP/failures.cut" "$RUNNER_TEMP/failures.txt"
          [ -s "$RUNNER_TEMP/failures.txt" ] || exit 0
          body=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/failures.txt" | awk 'BEGIN { ORS = "%0A" } { print }')
          echo "::error title=go test failed on ${{ runner.os }} (share ${{ matrix.shard }}/${{ matrix.of }})::$body"

      - if: always()
        uses: ./.github/actions/record-result
        with:
          kind: shard
          os: ${{ matrix.os }}
          index: ${{ matrix.shard }}
          status: ${{ job.status }}
          plan: ${{ runner.temp }}/plan.txt

  # The workspace is reached from many goroutines through one owner, and a
  # mistake in that is a race rather than a failure. The detector needs a C
  # toolchain, which the application itself never does, so it runs where the
  # runner has one: gcc on Linux, and on macOS the clang that comes with Xcode.
  # macOS runs it too because its scheduler and its own code -- how a process
  # is watched, how a file is locked -- give races other timings than Linux
  # does. Windows is left out until a C toolchain on its runner is known to
  # work with the detector.
  #
  # On macOS the detector is the slowest step of the slowest queue, so it runs
  # on pushes to main and in a release's run, and not on pull requests. Linux
  # runs it on every pull request. A race only macOS's timings show is
  # therefore found after the merge, not before it. A release's run is started
  # by a tag or by hand, so the event it sees is never pull_request. Which
  # platforms run it is decided by the changes job, since a matrix cannot be
  # chosen by the event.
  race:
    name: race (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.of }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.race) }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GTK4/WebKitGTK dev packages (Linux, for Wails)
        if: runner.os == 'Linux'
        timeout-minutes: 25
        uses: ./.github/actions/install-gtk

      - name: Race
        timeout-minutes: 40
        shell: bash
        env:
          CGO_ENABLED: "1"
          SHARD: ${{ matrix.shard }}
          OF: ${{ matrix.of }}
          RETRY_ALL: ${{ github.event_name != 'pull_request' && '-retry-all' || '' }}
        run: |
          go run .github/scripts/shardtests.go -shard "$SHARD/$OF" -profile race -retry $RETRY_ALL \
            -log "$RUNNER_TEMP/go-race.log" -digest "$RUNNER_TEMP/plan.txt" \
            -gotestflags "-race -count=1 -timeout 20m"

      - name: Name the failures
        if: failure()
        timeout-minutes: 5
        shell: bash
        run: |
          : > "$RUNNER_TEMP/failures.txt"
          grep -E -A20 -- '--- FAIL|^panic:|^WARNING: DATA RACE' "$RUNNER_TEMP/go-race.log" | tr -d '\r' >> "$RUNNER_TEMP/failures.txt" || true
          head -c 30000 "$RUNNER_TEMP/failures.txt" > "$RUNNER_TEMP/failures.cut" && mv "$RUNNER_TEMP/failures.cut" "$RUNNER_TEMP/failures.txt"
          [ -s "$RUNNER_TEMP/failures.txt" ] || exit 0
          body=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/failures.txt" | awk 'BEGIN { ORS = "%0A" } { print }')
          echo "::error title=go test -race failed on ${{ runner.os }} (share ${{ matrix.shard }}/${{ matrix.of }})::$body"

      - if: always()
        uses: ./.github/actions/record-result
        with:
          kind: race
          os: ${{ matrix.os }}
          index: ${{ matrix.shard }}
          status: ${{ job.status }}
          plan: ${{ runner.temp }}/plan.txt

  # The three checks the branch protection names, "test (ubuntu-latest)" and the
  # others, are this job. It reports each platform from the results its static,
  # shard and race jobs left, and it runs when they fail, or are cancelled or
  # skipped, because a job skipped because its dependency failed is counted as
  # passing by the branch protection. It runs on Linux for every platform, since
  # all it does is read the results (.github/scripts/test-gate.sh).
  #
  # For a change to documentation only the other jobs are skipped, and the tests
  # that read those files run here in place of the rest, on the Ubuntu name. CGO
  # is off because the window package has a stand-in without it, so no GTK
  # packages are needed. A test elsewhere that reads a doc is first run by the
  # push to main. The release notes test is the one test of cmd/release that
  # reads a root markdown file; the rest of it builds the application.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    needs: [changes, static, shard, race]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # A platform that is not run in this run (see the changes job). In a pull
      # request that is a failure, so that the branch protection waits for the
      # label ready-to-merge and the run it starts; on main it is not.
      - name: Say that this platform was not run
        if: needs.changes.outputs.docs_only != 'true' && !contains(fromJSON(needs.changes.outputs.oses), matrix.os)
        env:
          EVENT: ${{ github.event_name }}
          OS: ${{ matrix.os }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "::error title=Tests on $OS::Not run yet. Add the label ready-to-merge to this pull request to run the tests on Windows and macOS."
            exit 1
          fi
          echo "::notice title=Tests on $OS::Not run for this push. The release, the weekly run and a run by hand cover it."

      - uses: actions/setup-go@v7
        if: needs.changes.outputs.docs_only == 'true' && matrix.os == 'ubuntu-latest'
        with:
          go-version-file: go.mod
          cache: true

      - name: Test what reads the docs (documentation-only change)
        if: needs.changes.outputs.docs_only == 'true' && matrix.os == 'ubuntu-latest'
        timeout-minutes: 20
        env:
          CGO_ENABLED: "0"
        run: |
          go test -count=1 -timeout 10m ./cmd/helpfacts ./internal/record ./internal/acp/manifest ./cmd/docgen ./cmd/sitegen ./cmd/deploydrift
          go test -count=1 -timeout 10m -run TestNoticesNameEveryLinkedModule ./cmd/release
          go test -count=1 -timeout 10m -run 'Schema|TestGraph|TestTwoTeamGraph|TestStructuredDocQuotes' ./internal/server
          go test -count=1 -timeout 10m -run TestRecordingFollowsTheStoredConversation ./internal/workspace

      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.docs_only != 'true' && contains(fromJSON(needs.changes.outputs.oses), matrix.os)
        continue-on-error: true
        with:
          pattern: result-*-${{ matrix.os }}-*
          path: ${{ runner.temp }}/results
          merge-multiple: true

      - name: Check the results
        if: needs.changes.outputs.docs_only != 'true' && contains(fromJSON(needs.changes.outputs.oses), matrix.os)
        timeout-minutes: 5
        env:
          RACE_OSES: ${{ needs.changes.outputs.race_os }}
        run: bash .github/scripts/test-gate.sh "$RUNNER_TEMP/results" "${{ matrix.os }}" "$RACE_OSES" "${{ fromJSON(needs.changes.outputs.counts)[matrix.os] }}"

  # scripts/purge-downloads.sh deletes released files for good, so its tests
  # (cmd/release/purge_test.go) run it for real: the runner's aws CLI against
  # moto's S3 server with versioning on, and stand-ins for the CDN and its
  # purge APIs. The test job above skips them, having no store to run them
  # against. It needs no GTK, since cmd/release is not the application.
  #
  # A change to documentation only skips it, as it skips the platform jobs' steps
  # (see the changes job). It runs if the changes job failed, or said nothing.
  purge-script:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Shellcheck
        timeout-minutes: 5
        run: shellcheck -s sh scripts/purge-downloads.sh

      - name: Start an S3-compatible store
        timeout-minutes: 5
        run: |
          python3 -m venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/moto/bin/pip" install --quiet 'moto[server]==5.2.3'
          "$RUNNER_TEMP/moto/bin/moto_server" -H 127.0.0.1 -p 5055 > "$RUNNER_TEMP/moto.log" 2>&1 &
          for _ in $(seq 30); do
            curl -fsS -o /dev/null http://127.0.0.1:5055/ && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/moto.log"
          echo "::error::moto's S3 server did not start"
          exit 1

      - name: Test
        timeout-minutes: 25
        env:
          FLOCKDECK_TEST_S3_ENDPOINT: http://127.0.0.1:5055
        # -v and the list after it show where the time goes, test by test, in
        # the log and in the job summary. The list is printed again at the end,
        # sorted, and includes the indented subtests, so a parent's time
        # contains its children's and the times do not add up to the total.
        run: |
          set -o pipefail
          status=0
          go test -v -count=1 -timeout 20m -run '^TestPurgeScript' ./cmd/release 2>&1 | tee "$RUNNER_TEMP/purge-test.log" || status=$?
          {
            echo '### TestPurgeScript timings (seconds)'
            echo '```'
            awk '$1 == "---" { t = $4; gsub(/[()s]/, "", t); print t, $2, $3 }' "$RUNNER_TEMP/purge-test.log" | sort -rn
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status
