name: docker-image

# Builds and publishes the self-hosted container image (Dockerfile at the
# repository root) on the same v* tag release.yml cuts a binary release
# from, so a GitHub release and a container image are always in sync -- a
# separate workflow rather than a job added to release.yml itself, so a
# problem here (a registry outage, a failed scan) cannot hold up or fail the
# binary release release.yml already reliably produces.
#
# Written against the Dockerfile and the versioning scheme in
# flockdeck-planning/12-installation-simplification.md. Its first real runs
# (v0.3.31, v0.3.32, v0.3.33) found what reading it couldn't: a trivy-action
# pin that didn't resolve (fixed in #14/#16), the appwindow/wails cgo build
# (fixed in #19), and the SBOM step needing write access to attach to the
# release -- the repo's default workflow token is read-only on purpose, so
# that step alone carries its own scoped token (FLOCKDECK_RELEASE_CONTENTS_TOKEN)
# instead of this block asking for more than the rest of the workflow needs.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to build (must already exist)"
        required: true

permissions:
  contents: read

jobs:
  # Held to the same tests a binary release is, for the same reason
  # release.yml calls test.yml itself: nothing is published, image or
  # binary, that has not passed on every platform.
  test:
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Push to ghcr.io/flockdeck/flockdeck with the workflow's own token --
      # public, under the current jmwri owner, per
      # flockdeck-planning/12-installation-simplification.md -- so no
      # separate registry credential is needed.
      packages: write
      contents: read
      # cosign's keyless signing: it exchanges this OIDC token for a
      # short-lived certificate from Sigstore's Fulcio, rather than a
      # signing key kept as a repository secret.
      id-token: write
    concurrency:
      group: docker-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Work out the version and tags
        id: version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::$TAG is not a version release.yml would also accept; tag v1.2.3, or v1.2.3-rc.1 for a candidate"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # v1.2.3 also tags :v1.2 and :v1 (the newest patch/minor a self-hoster
          # pinning to either finds); a candidate (v1.2.3-rc.1) only ever
          # publishes its own exact tag plus the short-sha one below, the same
          # way release.yml never makes a candidate GitHub's "latest" release.
          case "$TAG" in
            *-*) echo "floating=" >> "$GITHUB_OUTPUT" ;;
            *)
              minor="${TAG%.*}"
              major="${minor%.*}"
              echo "floating=$minor $major latest" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tag list
        id: tags
        env:
          IMAGE: ghcr.io/flockdeck/flockdeck
          TAG: ${{ steps.version.outputs.tag }}
          FLOATING: ${{ steps.version.outputs.floating }}
        run: |
          tags="$IMAGE:$TAG,$IMAGE:$TAG-${GITHUB_SHA::7}"
          for t in $FLOATING; do
            tags="$tags,$IMAGE:$t"
          done
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      # Multi-arch: amd64 and arm64, so a self-hoster on a Pi or an arm64
      # VPS (the README's "a NAS or a cheap VPS" self-hosting pitch) gets a
      # native image rather than emulation.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
          provenance: true
          sbom: true

      # A second, explicit SBOM in SPDX form attached as a signed attestation,
      # on top of build-push-action's own (BuildKit-generated) one above --
      # Syft reads the actual image rather than the build context, which
      # catches anything BuildKit's own attestor misses in a base image layer.
      #
      # This step also tries to attach the SBOM file to the GitHub release
      # for this tag (upload-release-assets, its default). That often loses
      # a race against release.yml, a separate workflow the same tag push
      # triggers independently: if this step runs before release.yml has
      # actually published the release, there's nothing yet to attach to,
      # and the action skips that part without erroring. Confirmed on
      # v0.3.36 -- this step ran a little over a minute before the release
      # was published, so nothing was attached, silently. Left as is: the
      # image is still signed and the SBOM still attested via cosign below,
      # independent of any GitHub release, which is the mechanism that
      # actually matters. A missing SBOM file on the release page is a
      # convenience gap, not a security one -- not worth making this
      # workflow wait on release.yml's publish for.
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/flockdeck/flockdeck@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          # The repo's default workflow token is read-only, and stays that
          # way -- this is the one step that needs to attach a file to the
          # release, so it alone gets a token scoped for it, rather than
          # raising the ambient GITHUB_TOKEN's permissions for every
          # workflow in the repo.
          github-token: ${{ secrets.FLOCKDECK_RELEASE_CONTENTS_TOKEN }}

      # Fails the run on a high/critical CVE in a layer this image actually
      # ships (base image + the flockdeck binary's own dependencies), rather
      # than publishing a tag and finding out from a scanner later.
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/flockdeck/flockdeck@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - uses: sigstore/cosign-installer@v3

      # Signs the digest every tag above points at, once, rather than each
      # tag separately -- a tag can move, the digest a self-hoster actually
      # pulls (by digest, or resolved from a tag at pull time) is what
      # `cosign verify` checks against.
      - name: Sign the image
        run: cosign sign --yes "ghcr.io/flockdeck/flockdeck@${{ steps.build.outputs.digest }}"

      - name: Attest the SBOM
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "ghcr.io/flockdeck/flockdeck@${{ steps.build.outputs.digest }}"

      - name: Summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### ghcr.io/flockdeck/flockdeck:$TAG"
            echo
            echo "digest: \`$DIGEST\`"
            echo
            echo "verify: \`cosign verify ghcr.io/flockdeck/flockdeck@$DIGEST --certificate-identity-regexp '.*' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`"
          } >> "$GITHUB_STEP_SUMMARY"
