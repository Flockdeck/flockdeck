name: weekly full CI

# The whole test matrix once a week on main, because a push to main and a pull
# request without the label ready-to-merge are tested on Linux only (see
# test.yml). A failure here shows in no pull request, so it opens an issue, or
# adds to the one that is open.
#
# The issue is written from this file and not from test.yml: test.yml is also
# called by the release and image workflows, which do not grant issues: write,
# and a called workflow that asks for more than its caller grants does not start.
on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  report:
    needs: test
    if: ${{ always() && needs.test.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: weekly full CI failed
        run: |
          body="The weekly run of all three platforms failed: $RUN_URL"
          number=$(gh issue list --repo "$REPO" --state open --search "\"$TITLE\" in:title" --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$body"
          fi
