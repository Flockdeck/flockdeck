# Trusted half of the PR-review pipeline for this public repo. Triggered by
# `workflow_run` after pr-review.yml finishes — the standard safe pattern
# for commenting on a PR from an untrusted source (see the plan's Sources on
# "pwn requests"): this job gets write access and can hold secrets, but it
# never checks out the PR's code, only the diff artifact the untrusted job
# already produced.
#
# NEEDS MANUAL SETUP: create the `pr-review-external` environment in this
# repo's Settings > Environments with required reviewers configured, so a
# human approves before this runs for a first-time or forked-repo
# contributor (plan b.4). Until that environment exists, GitHub runs this
# job ungated. See .github/CONTRIBUTOR_WORKFLOW_SETUP.md for the full manual
# checklist, including the GitHub App and secrets this workflow expects.
#
# check-permission decides whether that gate applies at all: it asks the
# GitHub API whether the author of the PR that pr-review.yml ran for (found
# from the run's head commit; the run's actor is not used, since a push or an
# "Update branch" click makes someone else the actor) has write or admin
# access to this repo, and gate's own `if:` skips the
# job entirely when they do. An `if:` can't call the API itself, hence the
# separate job — checking a live permission this way, rather than a
# hardcoded username list, is what the environment gate's own setup step
# above used to defer this on.
#
# Skipping gate this way, rather than trying to exempt trusted actors in
# the environment's own protection rule, is deliberate: required-reviewers
# protection has no actor-based exemption in the environment settings UI
# and applies to anyone who isn't a required reviewer, so the only lever is
# whether the job runs at all. Environment protection is only ever engaged
# for a job that actually runs.
#
# The approval gate and the post itself are two jobs, not one, because
# GitHub rejects `environment:` on a job that also calls a reusable
# workflow with `uses:` ("Invalid workflow file ... Unexpected value
# 'uses'"): a job may hold required-reviewers protection, or call out to
# another workflow, but never both at once. gate holds the environment (and
# so the approval requirement, once the environment exists) and does
# nothing else; post only runs once gate has, via `needs`, and is a plain
# reusable-workflow call with no environment of its own.
#
# post cannot simply inherit gate's default success()-based condition,
# though: GitHub skips a job whose `needs` includes a job that was itself
# skipped, which -- now that gate is deliberately skipped for a trusted
# actor -- would silently stop post from ever running for exactly the
# contributors this change means to stop blocking. post's own `if:` below
# spells out both ways it is allowed to run (gate approved it, or gate was
# skipped because check-permission found a trusted actor) instead of
# relying on the implicit condition, and keeps checking
# workflow_run.conclusion itself so a skip for the *other* reason -- the
# untrusted job didn't succeed -- still stops post as before.
name: PR review - post

on:
  workflow_run:
    workflows: ["PR review"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-permission:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
    steps:
      - name: Check the PR author's repo permission
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            // The author of the PR, not the actor of the run: for a push or
            // an "Update branch" click the actor is whoever did that, who may
            // have write access on a PR somebody else wrote. The PR is found
            // from the run's head commit, which also works for a fork (the
            // run's own pull_requests list is empty for one). No PR found, or
            // any whose author cannot be read, is untrusted.
            const sha = context.payload.workflow_run.head_sha;
            let authors = [];
            try {
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: sha,
              });
              authors = prs.filter((p) => p.head.sha === sha && p.user).map((p) => p.user.login);
            } catch (err) {
              core.warning(`could not find the PR for ${sha}, treating as untrusted: ${err.message}`);
            }
            if (authors.length === 0) {
              core.setOutput("trusted", false);
              return;
            }
            // A failed call (a transient API error, a since-deleted
            // account) must not read as trusted -- that would skip gate
            // below and let an unreviewed author's post run ungated, the
            // opposite of what this whole check is for. Left false, gate
            // still runs and asks for approval exactly as it did before
            // this check existed.
            let trusted = true;
            for (const author of authors) {
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: author,
                });
                // write or admin is an established contributor, trusted with
                // the same secrets this repo's own maintainers already have;
                // maintain and below (read/triage/none -- what a first-time
                // or forked-repo contributor gets on a public repo) go
                // through the gate below.
                const ok = data.permission === "admin" || data.permission === "write";
                core.info(`${author}'s permission on this repo is ${data.permission} (trusted: ${ok})`);
                trusted = trusted && ok;
              } catch (err) {
                core.warning(`could not check ${author}'s permission on this repo, treating as untrusted: ${err.message}`);
                trusted = false;
              }
            }
            core.setOutput("trusted", trusted);

  gate:
    needs: check-permission
    if: github.event.workflow_run.conclusion == 'success' && needs.check-permission.outputs.trusted != 'true'
    environment: pr-review-external
    runs-on: ubuntu-latest
    steps:
      - run: echo "approved to post a review"

  post:
    needs: [check-permission, gate]
    if: always() && github.event.workflow_run.conclusion == 'success' && (needs.gate.result == 'success' || (needs.gate.result == 'skipped' && needs.check-permission.outputs.trusted == 'true'))
    uses: Flockdeck/flockdeck/.github/workflows/reusable-pr-review-post.yml@main
    with:
      artifact-run-id: ${{ github.event.workflow_run.id }}
      run-head-sha: ${{ github.event.workflow_run.head_sha }}
    secrets:
      review-app-id: ${{ secrets.PR_REVIEW_APP_ID }}
      review-app-private-key: ${{ secrets.PR_REVIEW_APP_PRIVATE_KEY }}
      llm-api-key: ${{ secrets.PR_REVIEW_LLM_API_KEY }}
