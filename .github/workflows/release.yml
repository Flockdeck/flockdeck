name: release

# A release is cut by pushing a tag. The tag is the version: it is stamped into
# the binaries, it names the archives, and it is what the updater compares
# against to decide whether a running copy is behind.
on:
  push:
    tags:
      - "v*"
  # Cutting a release by hand is useful when a tag was pushed before the
  # workflow existed, or when a run has to be repeated. Start it from the tag
  # itself, in "Use workflow from": the release job runs in the release
  # environment, which only a v* tag may deploy to, so a run started from main
  # is refused.
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to build (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  # Nothing is published that does not pass, on every platform a release is
  # built for. Much of what differs between them — how a running program is
  # replaced, how a file another process holds is waited out, how a failure
  # to start is shown — is only exercised by the tests on the platform itself,
  # and a Linux runner alone never ran the Windows code at all. The tests are
  # the ones every push and pull request runs, called from test.yml, so a
  # release is held to exactly what a change is.
  test:
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
      # A release is also held to what only a release needs, such as
      # carrying the key its signatures are checked with.
      release: true

  # The tag is worked out once, here, rather than separately in build and
  # release: the two would otherwise have to agree by construction alone, and
  # the tag reaches every later step through an output rather than being
  # written into a script, which a hand-run release would otherwise paste into
  # as free text, run as shell with a token that can write to the repository.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Work out the version
        id: version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The tag is stamped into the binaries and is what the updater compares
      # against. One it cannot read would ship a release that never updates
      # and that no later release can replace, so it is refused before
      # anything is built.
      - name: Check the tag is a version
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::$TAG is not a version the updater can read; tag v1.2.3, or v1.2.3-rc.1 for a candidate"
            exit 1
          fi

  # Windows still cross-compiles both its archs from any machine: its window
  # (internal/appwindow) reaches WebView2 through raw syscalls, no cgo. Linux
  # and macOS draw their window with GTK4/WebKitGTK and Cocoa, both cgo, so
  # every other target builds natively instead, one matrix entry per
  # platform. There is no cross toolchain for darwin from a non-Mac host,
  # which is why this is a matrix of native builds rather than one runner
  # cross-compiling everything, as it used to before the window moved onto
  # Wails.
  #
  # linux/arm64 tried cross-compiling from the same ubuntu-latest runner as
  # linux/amd64 first, with the arm64 GTK4/WebKitGTK dev packages and a
  # cross compiler installed alongside the native ones. That does not work:
  # libwebkitgtk-6.0-dev and its arm64 copy Conflict with each other in apt,
  # so the two could never be installed together to link against. It builds
  # on ubuntu-24.04-arm instead -- a real arm64 machine, free for this
  # public repository the same way every other Linux runner here is -- the
  # same way every other platform in this matrix builds on its own kind.
  build:
    needs: [test, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platforms: linux/amd64
          - os: ubuntu-24.04-arm
            platforms: linux/arm64
          - os: windows-latest
            platforms: windows/amd64,windows/arm64
          - os: macos-latest
            platforms: darwin/amd64,darwin/arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      # The release is built from nothing cached. The build cache is shared
      # with the test runs on main, which execute every test, dependencies'
      # included, and a release restored from it would be built from what
      # they left there, and then signed.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # Wails' Linux backend, native on whichever architecture this job's
      # own runner is.
      - name: Install GTK4/WebKitGTK dev packages (Linux, for Wails)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Build and package
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: go run ./cmd/release -version "$TAG" -out dist -platforms ${{ matrix.platforms }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  # One release is published at a time. Two at once -- a fix to an older line
  # cut beside a new release -- would each read the latest release before
  # either had moved it, on GitHub and on the site, and whichever finished
  # last would be the latest, older or not. So a second run waits for the
  # first rather than cancelling it: a release stopped part way is published
  # on GitHub and missing from the site. The tests still run side by side;
  # only publishing takes turns. GitHub holds one run waiting, though, and a
  # third started meanwhile replaces it, so that one needs running again.
  #
  # The job runs in the release environment, which only a v* tag may deploy
  # to, and which holds the signing key and the download bucket's credentials.
  # Kept as repository secrets, any workflow run on any branch could read them,
  # so anyone able to push a branch with a workflow that printed them could
  # take the signing key. Named here, the secrets below are the environment's
  # copies, and a run that is not on a v* tag is refused before it starts.
  release:
    needs: [test, build, version]
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # The version is derived from the tag rather than from git describe,
          # but the full history costs little and keeps `make` usable in the
          # same checkout.
          fetch-depth: 0
          # The token that fetched the code is not left in .git/config, where
          # every later step, and whatever the build runs, could read it.
          # Nothing here pushes: gh takes its token from GH_TOKEN, and the
          # publish script is read from this checkout with git show.
          persist-credentials: false

      # The release is built from nothing cached. The build cache is shared
      # with the test runs on main, which execute every test, dependencies'
      # included, and a release restored from it would be built from what
      # they left there, and then signed.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # Every platform's build job uploaded its own archives; merged here into
      # one directory, the way a single cross-compiling runner used to leave
      # them, so everything below -- checksums, signing, publishing -- still
      # works on one dist directory holding every platform.
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      # Each build job wrote its own checksums.txt, covering only the
      # platforms it built -- of no use merged, and sign refuses a
      # checksums.txt missing a platform. This recomputes it from every
      # archive now sitting in dist together.
      - name: Checksum the merged release
        run: go run ./cmd/release -sums -out dist

      - name: List what was built
        run: ls -l dist && cat dist/checksums.txt

      # checksums.txt and the release's manifest are signed with the release
      # key, whose public half every build carries, so that what the updater
      # downloads can be trusted without trusting where it came from: the
      # site, or GitHub, where the updater goes when the site fails and which
      # it holds to the same signature. So the release is signed before it is
      # published anywhere, and a missing key stops the run before GitHub
      # has a release every copy would refuse.
      #
      # The notes GitHub generates go into the manifest, so the update chip
      # shows them as it did when the updater read them from GitHub. They are
      # generated here, before the release exists, and the release is made
      # with the same notes; a release being published again keeps its own.
      # Only GitHub's answer that there is no such release counts as there
      # being none. Any other failure to ask stops the run: taken for none, a
      # release published before would be given fresh notes, and below it
      # would be created again.
      - name: Sign
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          FLOCKDECK_SIGNING_KEY: ${{ secrets.FLOCKDECK_SIGNING_KEY }}
        run: |
          if gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/notes.md" 2> "$RUNNER_TEMP/gh.err"; then
            echo "$TAG is already released on GitHub, and keeps its notes"
          elif grep -Eq 'release not found|HTTP 404' "$RUNNER_TEMP/gh.err"; then
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body > "$RUNNER_TEMP/notes.md"
          else
            cat "$RUNNER_TEMP/gh.err" >&2
            echo "::error::could not ask GitHub whether $TAG is released already, so nothing has been signed or published"
            exit 1
          fi
          go run ./cmd/release -sign -version "$TAG" -out dist -notes "$RUNNER_TEMP/notes.md"

      # gh is already on the runner, so the release is made without a
      # third-party action holding the token.
      #
      # A tag with a suffix, v1.4.0-rc.1, is a candidate. Published as an
      # ordinary release it would be the latest one, which is what every
      # running copy asks GitHub for and installs; a pre-release is skipped.
      #
      # What was signed goes up with the archives: checksums.txt.sig above
      # all, which the updater requires of a release it reads from GitHub.
      # latest.json does not; it only names the site's latest release.
      #
      # GitHub makes every new release its latest, and a release older than
      # the latest there -- a fix to an older line cut after a newer release
      # -- would then be what every copy reading GitHub is offered, and each
      # would throw away the newer release it had staged as withdrawn. So one
      # that is not newer is published without being made the latest.
      #
      # As in signing, only GitHub's answer that there is no release counts as
      # there being none. A failure to ask for the latest release taken for
      # there being none would make any release the latest, older or not.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          latest=""
          if current=$(gh release view --json tagName --jq .tagName 2> "$RUNNER_TEMP/gh.err"); then
            :
          elif grep -Eq 'release not found|HTTP 404' "$RUNNER_TEMP/gh.err"; then
            current=""
          else
            cat "$RUNNER_TEMP/gh.err" >&2
            echo "::error::could not ask GitHub for its latest release, so whether $TAG may become it is not known; nothing has been published"
            exit 1
          fi
          if [ -z "$pre" ] && [ -n "$current" ] && [ "$current" != "$TAG" ] &&
            [ "$(printf '%s\n' "$current" "$TAG" | sort -V | tail -n 1)" != "$TAG" ]; then
            echo "$current is newer than $TAG, and stays GitHub's latest release"
            latest="--latest=false"
          fi
          set --
          for f in dist/*; do
            [ "${f##*/}" = latest.json ] || set -- "$@" "$f"
          done
          if gh release view "$TAG" --json tagName >/dev/null 2> "$RUNNER_TEMP/gh.err"; then
            gh release upload "$TAG" "$@" --clobber
          elif grep -Eq 'release not found|HTTP 404' "$RUNNER_TEMP/gh.err"; then
            gh release create "$TAG" "$@" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" $pre $latest
          else
            cat "$RUNNER_TEMP/gh.err" >&2
            echo "::error::could not ask GitHub whether $TAG is released already, so it has been neither created nor added to"
            exit 1
          fi
          # gh release create has not always carried --latest=false through
          # to GitHub: with files to upload it makes a draft and publishes it
          # afterwards, and the flag has been lost on the way. So the release
          # is told again, through the API by its id, that it is not the
          # latest, and the latest is asked for: if it is not the newer
          # release any more, that one is made the latest again.
          if [ -n "$latest" ]; then
            id=$(gh release view "$TAG" --json databaseId --jq .databaseId)
            case "$id" in "" | *[!0-9]*) echo "::error::could not find $TAG's release id, to keep $current the latest"; exit 1 ;; esac
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -f make_latest=false >/dev/null
            now=$(gh release view --json tagName --jq .tagName)
            if [ "$now" != "$current" ]; then
              echo "GitHub's latest release is $now; making $current the latest again"
              id=$(gh release view "$current" --json databaseId --jq .databaseId)
              case "$id" in "" | *[!0-9]*) echo "::error::could not find $current's release id, to make it the latest again"; exit 1 ;; esac
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -f make_latest=true >/dev/null
            fi
          fi

      # From here the release goes to dl.flockdeck.ai, the DigitalOcean Space
      # behind DigitalOcean's CDN that the updater, the install scripts and the
      # site download from first. GitHub is published above, first, on
      # purpose: every copy installed before the site knows only GitHub, so a
      # run that stops anywhere below has still made a release, one that is
      # only missing from the site.
      #
      # Every secret the rest needs is checked before any of it runs, and all
      # the missing ones are named at once. Terraform writes every one of them
      # (svc/flockdeck-site/release.tf in terrawost).
      - name: Check the download site's secrets
        env:
          TAG: ${{ needs.version.outputs.tag }}
          DO_SPACES_KEY: ${{ secrets.DO_SPACES_KEY }}
          DO_SPACES_SECRET: ${{ secrets.DO_SPACES_SECRET }}
          DO_SPACES_BUCKET: ${{ secrets.DO_SPACES_BUCKET }}
          DO_SPACES_REGION: ${{ secrets.DO_SPACES_REGION }}
        run: |
          missing=""
          for name in DO_SPACES_KEY DO_SPACES_SECRET DO_SPACES_BUCKET DO_SPACES_REGION; do
            [ -n "$(printenv "$name" || true)" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::$TAG is published on GitHub, but cannot go to dl.flockdeck.ai until these repository secrets are set:$missing. Terraform writes them: apply terrawost's svc/flockdeck-site/release.tf"
            exit 1
          fi

      # The script says why the order is what it is. It is kept in the
      # repository so that it can be run by hand, and tried against any
      # S3-compatible store. The aws CLI is already on the runner.
      #
      # The script is run as this workflow's own commit has it, not as the
      # tag's. For a pushed tag they are one commit. A release run by hand,
      # though, builds an older tag with the workflow on main, and the tag's
      # copy of the script predates whatever it has learned since: one from
      # before it compared versions moves latest.json and /latest/ back to the
      # older release, and every copy that had staged the newer one throws it
      # away as withdrawn. The checkout above fetched every branch, so the
      # commit is here to read it from.
      - name: Publish to dl.flockdeck.ai
        env:
          TAG: ${{ needs.version.outputs.tag }}
          DO_SPACES_KEY: ${{ secrets.DO_SPACES_KEY }}
          DO_SPACES_SECRET: ${{ secrets.DO_SPACES_SECRET }}
          DO_SPACES_BUCKET: ${{ secrets.DO_SPACES_BUCKET }}
          DO_SPACES_REGION: ${{ secrets.DO_SPACES_REGION }}
        run: |
          if ! git show "$GITHUB_SHA:scripts/publish-downloads.sh" > "$RUNNER_TEMP/publish-downloads.sh"; then
            echo "::error::$TAG is published on GitHub, but the publish script could not be read from $GITHUB_SHA, the workflow's own commit"
            exit 1
          fi
          sh "$RUNNER_TEMP/publish-downloads.sh" "$TAG" dist
